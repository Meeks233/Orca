name: Release

# Everything a tagged Orca release publishes, except the container image —
# that one is built by ci.yml's `image` job, which already runs on `v*` tags and
# is gated behind the full test suite.
#
#   userscript → orca.user.js, the Tampermonkey client (auto-update asset)
#   signing    → reports whether an Android release keystore is configured
#   android    → signed universal APK + AAB, when it is
#   publish    → one GitHub Release carrying what got built, plus SHA256SUMS
#   fdroid     → rehearses F-Droid's own from-source build of the tag
#   play       → optional, manual: uploads the AAB to a Google Play track

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish_play:
        description: Upload the signed AAB to Google Play
        type: boolean
        default: false
      play_track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

permissions:
  contents: read

jobs:
  # Cheap, so it runs first and alone: if the tag and the manifests disagree
  # there is no point spending half an hour on an Android build.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Via env, not inline ${{ }}: ref names are untrusted text.
      - name: Check version consistency against the tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: scripts/check-versions.sh ${RELEASE_TAG:+"$RELEASE_TAG"}

  userscript:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build userscript
        working-directory: extension
        run: |
          npm ci
          npm run dist

      # The asset name is load-bearing: the banner's @updateURL is
      # .../releases/latest/download/orca.user.js, so renaming it here silently
      # breaks auto-update for every installed copy.
      - name: Stage userscript
        run: |
          mkdir -p dist
          install -m 0644 extension/dist-userscript/orca.user.js dist/orca.user.js

      - name: Upload userscript artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orca-userscript
          path: dist/orca.user.js
          if-no-files-found: error

  # A job-level `if:` cannot read the secrets context, so the check lives in a
  # step and is re-exported as an output. Without this the whole release is
  # hostage to one optional secret: `android` fails, `publish` never runs, and a
  # tag ships nothing at all — not even the userscript or the image, which need
  # no credentials.
  signing:
    needs: verify
    runs-on: ubuntu-latest
    environment: android-release
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Is the release keystore configured?
        id: check
        env:
          KEYSTORE_BASE64: ${{ secrets.ORCA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORCA_ANDROID_KEYSTORE_BASE64 is not set in the android-release environment — skipping the signed Android build. The release will carry the userscript only. See docs/RELEASING_ANDROID.md#signing."
          fi

  android:
    needs: [verify, signing]
    if: needs.signing.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: android-release
    env:
      ORCA_ANDROID_KEYSTORE_PATH: /tmp/orca-release.jks
      ORCA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ORCA_ANDROID_KEYSTORE_PASSWORD }}
      ORCA_ANDROID_KEY_ALIAS: ${{ secrets.ORCA_ANDROID_KEY_ALIAS }}
      ORCA_ANDROID_KEY_PASSWORD: ${{ secrets.ORCA_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@802977a265b5f8825ebef2176db5f5f3edc82280 # main

      - name: Install cargo-tauri
        # --force is load-bearing: rust-cache restores ~/.cargo/.crates.toml
        # but not ~/.cargo/bin, so binstall sees "already installed", skips the
        # download, and the build then dies on `no such command: tauri`.
        run: cargo binstall -y --force 'tauri-cli@2.11.4'

      # The Tauri app embeds web/ (frontendDist). That bundle is committed, so a
      # stale one would ship silently — rebuild it here rather than trusting the
      # working tree (ci.yml only *checks* freshness, and this job doesn't need it).
      - name: Build frontend bundle
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ORCA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          base64 --decode <<< "$KEYSTORE_BASE64" > "$ORCA_ANDROID_KEYSTORE_PATH"
          chmod 600 "$ORCA_ANDROID_KEYSTORE_PATH"

      - name: Build signed APK and AAB
        working-directory: app
        run: cargo tauri android build --apk --aab --target aarch64 armv7

      - name: Stage release files
        run: |
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          mkdir -p dist
          install -m 0644 app/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab "dist/orca-$version.aab"
          install -m 0644 app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "dist/orca-$version.apk"
          # R8 is on (isMinifyEnabled), so without this Play shows obfuscated
          # stack traces. It is a debug aid rather than something users verify,
          # so `publish` drops it before checksumming — it exists only for Play.
          mapping="app/src-tauri/gen/android/app/build/outputs/mapping/universalRelease/mapping.txt"
          if [ -f "$mapping" ]; then install -m 0644 "$mapping" dist/mapping.txt; fi

      # Play's "what's new" is generated from the fastlane changelogs so there is
      # ONE source of truth per locale. The filename must be the versionCode,
      # which tauri-cli derives from tauri.conf.json's version — deriving it the
      # same way here means a version bump can't silently ship a stale changelog.
      - name: Assemble Play changelogs
        run: |
          code="$(node -p "const [a,b,c]=require('./app/src-tauri/tauri.conf.json').version.split('.').map(Number); a*1000000+b*1000+c")"
          mkdir -p dist/whatsnew
          for loc in en-US zh-CN; do
            src="fastlane/metadata/android/$loc/changelogs/$code.txt"
            if [ ! -f "$src" ]; then
              echo "::error::missing changelog $src for versionCode $code" >&2
              exit 1
            fi
            install -m 0644 "$src" "dist/whatsnew/whatsnew-$loc"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orca-android-release
          path: dist/
          if-no-files-found: error

  publish:
    # always(), because `android` is skipped outright when no keystore is
    # configured and a skipped dependency would otherwise skip this too. The
    # userscript is the one artifact every release must carry, so that is what
    # is actually required.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.userscript.result == 'success'
    needs: [android, userscript]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Named downloads, not `pattern: orca-*` — that glob would also pick up
      # orca-fdroid-unsigned, and an APK F-Droid has not signed is the last
      # thing that should appear on a release page.
      - name: Download the userscript
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orca-userscript
          path: dist

      - name: Download the signed Android build
        if: needs.android.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orca-android-release
          path: dist

      - name: Note a release without Android artifacts
        if: needs.android.result != 'success'
        run: |
          echo "::warning::Publishing without the signed APK/AAB — the android job did not succeed."
          echo "This release carries the userscript only; the Android build was skipped or failed." >> "$GITHUB_STEP_SUMMARY"

      # mapping.txt and whatsnew/ ride along in the Android artifact because the
      # Play job needs them, but they are not things a user downloads or
      # verifies — drop them before checksumming and publishing.
      - name: Checksum published artifacts
        run: |
          rm -rf dist/whatsnew dist/mapping.txt
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # The CHANGELOG section for this version becomes the top of the release
      # body, with GitHub's generated commit list underneath. An unreleased or
      # misnamed heading yields empty notes rather than a failure, so the
      # extraction is checked.
      - name: Extract changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="## ${TAG#v} " 'index($0, v) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag --generate-notes --notes-file notes.md \
            --title "Orca $TAG"

  # F-Droid does not accept our binaries — it rebuilds the tag from source with
  # its own recipe and signs the result itself. This job runs that exact recipe
  # so a broken one surfaces here rather than in the fdroiddata merge request.
  # Deliberately NOT a dependency of `publish`: a recipe problem is a packaging
  # follow-up, not a reason to withhold the release.
  fdroid:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust toolchain and Android targets
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@802977a265b5f8825ebef2176db5f5f3edc82280 # main

      - name: Install cargo-tauri
        # --force is load-bearing: rust-cache restores ~/.cargo/.crates.toml
        # but not ~/.cargo/bin, so binstall sees "already installed", skips the
        # download, and the build then dies on `no such command: tauri`.
        run: cargo binstall -y --force 'tauri-cli@2.11.4'

      # F-Droid deletes every `scandelete` path before scanning, so the build
      # MUST regenerate them. Read the list out of the recipe rather than
      # repeating it: a recipe that quietly depends on a file it also deletes
      # would otherwise pass this rehearsal and still fail on F-Droid's builder.
      - name: Delete the recipe's scandelete paths, as fdroid does
        run: |
          python3 - <<'PY' > /tmp/scandelete.txt
          import json, yaml
          version = json.load(open("app/src-tauri/tauri.conf.json"))["version"]
          recipe = yaml.safe_load(open("packaging/fdroid/com.meeks233.orca.yml"))
          build = next(b for b in recipe["Builds"] if str(b["versionName"]) == version)
          print("\n".join(build.get("scandelete", [])))
          PY
          test -s /tmp/scandelete.txt || { echo "::error::recipe declares no scandelete paths"; exit 1; }
          while read -r path; do
            echo "removing $path"
            rm -rf -- "$path"
          done < /tmp/scandelete.txt

      - name: Rehearse the F-Droid recipe
        run: bash app/scripts/build-fdroid.sh

      - name: Confirm the build restored everything it deleted
        run: |
          missing=0
          while read -r path; do
            [ -e "$path" ] || { echo "::error::$path is in scandelete but the build did not regenerate it"; missing=1; }
          done < /tmp/scandelete.txt
          test "$missing" -eq 0

      - name: Confirm the recipe's declared output exists
        run: |
          out="$(sed -n 's/^    output: *//p' packaging/fdroid/com.meeks233.orca.yml | tail -n1)"
          test -f "$out" || { echo "::error::recipe output $out was not produced"; exit 1; }
          sha256sum "$out"
          {
            echo "### F-Droid rehearsal"
            echo
            echo "Recipe \`packaging/fdroid/com.meeks233.orca.yml\` built \`$out\` from source."
            echo "F-Droid signs with its own key, so this APK is a check, not a shippable artifact."
            echo
            echo "Submit by opening a merge request against \`fdroid/fdroiddata\` with this recipe."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the unsigned F-Droid APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orca-fdroid-unsigned
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if-no-files-found: error

  play:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_play
    needs: android
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download signed release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orca-android-release
          path: dist

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.meeks233.orca
          releaseFiles: dist/*.aab
          tracks: ${{ inputs.play_track }}
          status: completed
          # Generated from fastlane/metadata/**/changelogs/<versionCode>.txt by the
          # android job, and downloaded here as part of the release artifact.
          whatsNewDirectory: dist/whatsnew
          mappingFile: dist/mapping.txt
